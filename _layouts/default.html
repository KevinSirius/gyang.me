<!DOCTYPE html>
<html lang="en" data-theme="dark-poole">
  {% include head.html %}

  <body>
    <div class="container content">
      <header class="masthead">
        <h3 class="masthead-title">
          <a href="{{ site.baseurl }}/" title="Home">{{ site.title }}</a>

          <nav class="nav">
            <span class="lang-switch">
              <a href="#" data-lang="en" aria-label="English">English</a>
              <span class="lang-sep">|</span>
              <a href="#" data-lang="zh" aria-label="中文">中文</a>
            </span>
            {% for nav in site.nav %}
            <small><a href="{{ nav.url }}">{{ nav.title }}</a></small>
            {% endfor %}
          </nav>
        </h3>
      </header>

      <main>
        {{ content }}
      </main>

      <footer class="footer">
        <small>
          &copy;
          <time datetime="{{ site.time | date_to_xmlschema }}"
            >{{ site.time | date: '%Y' }}</time
          >. All rights reserved.
        </small>
      </footer>
    </div>

    <script>
      (function() {
        var lang = (function() {
          var m = /[?&]lang=(\w+)/.exec(location.search);
          if (m) {
            try { localStorage.setItem('post-lang', m[1]); } catch (e) {}
            return m[1];
          }
          try { return localStorage.getItem('post-lang') || 'en'; } catch (e) { return 'en'; }
        })();
        var map = { en: 'English', zh: 'Chinese' };
        var currentLang = map[lang] || 'English';
        document.querySelectorAll('[data-lang]').forEach(function(el) {
          var val = el.getAttribute('data-lang');
          if (val === 'English' || val === 'Chinese') {
            el.style.display = (val !== currentLang) ? 'none' : '';
          }
        });
        document.querySelectorAll('.lang-switch a').forEach(function(a) {
          var l = a.getAttribute('data-lang');
          var path = location.pathname || '/';
          if (path !== '/' && path.slice(-1) === '/') path = path.slice(0, -1);
          a.href = path + '?lang=' + l;
          if (l === lang) a.classList.add('lang-active');
        });
        var langParam = 'lang=' + lang;
        document.querySelectorAll('.nav a').forEach(function(a) {
          if (a.closest('.lang-switch')) return;
          var href = a.getAttribute('href');
          if (href && href.indexOf('?') === -1) a.setAttribute('href', href + '?' + langParam);
        });
      })();
    </script>
    {% if site.ga_analytics %}
    <script>
      (function (i, s, o, g, r, a, m) {
        i["GoogleAnalyticsObject"] = r;
        (i[r] =
          i[r] ||
          function () {
            (i[r].q = i[r].q || []).push(arguments);
          }),
          (i[r].l = 1 * new Date());
        (a = s.createElement(o)), (m = s.getElementsByTagName(o)[0]);
        a.async = 1;
        a.src = g;
        m.parentNode.insertBefore(a, m);
      })(
        window,
        document,
        "script",
        "https://www.google-analytics.com/analytics.js",
        "ga"
      );
      ga("create", "{{ site.ga_analytics }}", "auto");
      ga("send", "pageview");
    </script>
    {% endif %}
  </body>
</html>
